# ── Model ──────────────────────────────────────────────────────────────────────
model:
  name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  torch_dtype: "float16"       # bfloat16 on Ampere+; float16 elsewhere
  device_map: "auto"

# ── LoRA / QLoRA ───────────────────────────────────────────────────────────────
lora:
  r: 16                        # rank — higher = more capacity, more params
  lora_alpha: 32               # scaling factor (alpha/r = effective lr scale)
  target_modules:              # modules to attach LoRA adapters to
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# ── Quantisation (QLoRA) ───────────────────────────────────────────────────────
quantisation:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

# ── Training ───────────────────────────────────────────────────────────────────
training:
  output_dir: "models/checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4    # effective batch = 4 * 4 = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  evaluation_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  logging_steps: 25
  report_to: "none"              # MLflow logging done manually for full control
  seed: 42
  dataloader_num_workers: 2

# ── Data ───────────────────────────────────────────────────────────────────────
data:
  processed_dir: "data/processed"
  max_seq_length: 512

# ── MLflow ─────────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: "https://dagshub.com/sarthxk20/llmops-platform.mlflow"
  experiment_name: "llmops-customer-support-finetuning"
  run_tags:
    project: "llmops-serving-platform"
    model_family: "TinyLlama"
    technique: "QLoRA"
    dataset: "bitext-customer-support"

# ── Evaluation ─────────────────────────────────────────────────────────────────
evaluation:
  rouge_types: ["rouge1", "rouge2", "rougeL"]
  max_new_tokens: 256
  num_eval_samples: 200          # subset of test set for generation-based eval

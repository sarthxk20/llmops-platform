apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-server
  namespace: llmops
  labels:
    app: llmops-server
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llmops-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1    # at most 1 pod down during update
      maxSurge: 1          # spin up 1 extra pod before killing old ones
  template:
    metadata:
      labels:
        app: llmops-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path:   "/metrics"
        prometheus.io/port:   "8000"
    spec:
      containers:
        - name: llmops-server
          image: ghcr.io/sarthxk20/llmops-platform:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: llmops-config
            - secretRef:
                name: llmops-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"
          # Liveness: restart pod if this fails 3x
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          # Readiness: only route traffic when model is loaded
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          # Startup: give model load time before probes kick in
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: model-storage
              mountPath: /mnt/model
              readOnly: true
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
      terminationGracePeriodSeconds: 30
